<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f2ee" />
    <meta name="robots" content="noindex" />
    <title>You're offline | PropertyLink</title>
    <link rel="icon" href="/icon-192.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        background: #eef1ec; color: #1f2430;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      main { width: 100%; max-width: 380px; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 22px; line-height: 1.25; }
      p { margin: 0; font-size: 15px; line-height: 1.5; color: #4a5160; }
      button {
        margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; cursor: pointer;
        background: #33309a; color: #fff; font: inherit; font-weight: 600;
      }
      button:focus-visible { outline: 3px solid #33309a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="PropertyLink" />
      <h1>You're offline.</h1>
      <p>Check your connection; your data is safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Back online: reload the page the visitor was trying to open.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
