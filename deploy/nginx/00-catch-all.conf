# /etc/nginx/sites-available/00-catch-all  (symlink into sites-enabled)
# The *.linksuite wildcard DNS record sends any made-up name here; without a default_server nginx
# would answer it with the first site it loaded (Health Tutor). Unknown hosts get the connection closed.
# nginx 1.18 has no ssl_reject_handshake, so the 443 listener needs a throwaway self-signed cert:
#   mkdir -p /etc/nginx/ssl && openssl req -x509 -nodes -newkey rsa:2048 -days 3650 -subj /CN=invalid \
#     -keyout /etc/nginx/ssl/catch-all.key -out /etc/nginx/ssl/catch-all.crt
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/catch-all.crt;
    ssl_certificate_key /etc/nginx/ssl/catch-all.key;
    return 444;
}
